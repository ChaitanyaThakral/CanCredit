repos:
  # ── General file hygiene ────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key
      - id: no-commit-to-branch
        args: ['--branch', 'main']

  # ── Python formatting ────────────────────────────────────────────────────────
  - repo: https://github.com/psf/black
    rev: 24.1.0
    hooks:
      - id: black
        language_version: python3.11

  # ── SQL linting (plain SQL scripts only — excludes dbt Jinja models) ─────────
  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 3.0.5
    hooks:
      - id: sqlfluff-lint
        args:
          - '--dialect'
          - 'snowflake'
          - '--exclude-rules'
          - 'L016,L034'  # L016=long lines, L034=wildcard column order
        files: '^sql/.*\.sql$'  # Only lint /sql/ — dbt models use Jinja templating
