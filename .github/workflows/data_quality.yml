name: Daily Data Quality

on:
  schedule:
    - cron: '0 9 * * 1-5'
  workflow_dispatch:

jobs:
  dq-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'
      - run: pip install great_expectations snowflake-sqlalchemy
      - run: python -c "
          exec(open('great_expectations/setup_datasource.py').read());
          exec(open('great_expectations/build_expectations.py').read());
          exec(open('great_expectations/setup_checkpoint.py').read());
          import great_expectations as gx;
          ctx = gx.get_context();
          result = ctx.run_checkpoint('cancredit_daily');
          assert result.success, 'Data quality check failed'
          "
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
