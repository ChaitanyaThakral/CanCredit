name: dbt CI

on:
  pull_request:
    branches: [main]
    paths: ['dbt/**']

jobs:
  dbt-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dbt
        run: pip install dbt-snowflake==1.7.0

      - name: Configure dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'EOF'
          cancredit:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: ${{ secrets.SNOWFLAKE_ACCOUNT }}
                user: ${{ secrets.SNOWFLAKE_USER }}
                password: ${{ secrets.SNOWFLAKE_PASSWORD }}
                role: SYSADMIN
                database: CANCREDIT_DB
                warehouse: CANCREDIT_WH
                schema: STAGING_CI
                threads: 2
          EOF

      - name: dbt deps
        run: dbt deps --project-dir dbt/cancredit

      - name: dbt compile
        run: dbt compile --project-dir dbt/cancredit

      - name: dbt test staging
        run: dbt test --project-dir dbt/cancredit --select staging
